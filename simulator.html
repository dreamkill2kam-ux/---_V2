    <link rel="stylesheet" href="style.css">

<body class="eip-page">
    <!-- Скрипт темы -->
    <script src="theme.js"></script>

    <div class="kb-container" style="max-width: 1100px; display: flex; flex-direction: column;">
        <a href="extra_training.html" class="header-back-btn">← Вернуться в каталог</a>

        <!-- ЭКРАН ЗАПУСКА СЦЕНАРИЯ («Чистый стол») -->
        <div id="sim-start-screen" style="text-align: center; padding: 60px 20px; display: block;">
            <h1 style="margin-bottom: 15px;">Входящий звонок</h1>
            <p style="color: var(--text-sub); margin-bottom: 40px; font-size: 16px;">Ваша задача — отработать

                <button class="open-btn" onclick="startScenario()" style="margin-top: 25px;">Принять звонок</button>
            </div>
        </div>

        <div class="simulator-wrapper" id="simulator-wrapper" style="display: none;">
            <!-- ЛЕВАЯ ПАНЕЛЬ: Аватар и Лояльность -->
            <div class="sim-sidebar">
                <div class="sim-avatar-box">
                    <span class="sim-avatar-emoji" id="sim-avatar">😐</span>
                    <div class="loyalty-container">
                        <div class="loyalty-fill" id="loyalty-fill" style="width: 50%;"></div>

                    лояльность.
                </div>
            </div>

            <div class="sim-chat-area">
                <div class="sim-chat-history" id="sim-chat-history">
                    <!-- Реплики генерируются через JS -->
                </div>

                </div>

                <div id="sim-feedback" style="display: none; padding: 30px;">

                </div>

                                feedback: "<strong>Успех:</strong> Обучение и снятие страха перед ЭДО."
                            }
                        ]
                    }
                }
            }
        ];

        // === ЛОГИКА ДВИЖКА ===
        let currentScenarioIndex = 0;
        let currentStepId = "step_1";
        let loyalty = 50;
        let timerInterval;
        let timeLeft = 0;

        const startScreen = document.getElementById('sim-start-screen');
        const simWrapper = document.getElementById('simulator-wrapper');
        const callerName = document.getElementById('incoming-caller-name');

        const chatHistory = document.getElementById('sim-chat-history');
        const controls = document.getElementById('sim-controls');
        const feedbackBox = document.getElementById('sim-feedback');
        const loyaltyFill = document.getElementById('loyalty-fill');
        const avatarEmoji = document.getElementById('sim-avatar');
        const loyaltyScoreText = document.getElementById('loyalty-score-text');
        const timerUI = document.getElementById('sim-timer');
        const repliesBox = document.getElementById('sim-replies');

        // Перемешивание вариантов ответа
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // Инициализация стартового экрана
        function initStartScreen() {
            if (currentScenarioIndex >= simulatorScenariosV2.length) {
                showFinalResult();
                return;
            }
            const currentData = simulatorScenariosV2[currentScenarioIndex];
            callerName.innerText = currentData.title;
            startScreen.style.display = 'block';
            simWrapper.style.display = 'none';
        }

        // Запуск конкретного сценария
        function startScenario() {
            startScreen.style.display = 'none';
            simWrapper.style.display = 'flex';

            loyalty = 50; // Базовое значение для каждого нового звонка
            currentStepId = "step_1";
            chatHistory.innerHTML = ''; // Изоляция (чистый стол)
            updateLoyaltyUI();

            loadStep(currentStepId);
        }

        function loadStep(stepId) {
            const scenario = simulatorScenariosV2[currentScenarioIndex];
            const stepData = scenario.steps[stepId];

            controls.style.display = 'flex';
            feedbackBox.style.display = 'none';

            // Отрисовка сообщения контрагента
            const bubble = document.createElement('div');
            bubble.className = 'sim-bubble sim-bubble-carrier';
            bubble.innerHTML = stepData.carrier;
            chatHistory.appendChild(bubble);
            scrollToBottom();

            // Отрисовка кнопок
            repliesBox.innerHTML = '';
            const randomizedReplies = shuffle([...stepData.replies]);

            randomizedReplies.forEach(reply => {
                const btn = document.createElement('button');
                btn.className = 'sim-reply-btn';
                btn.innerHTML = reply.text;
                btn.onclick = () => selectReply(reply);
                repliesBox.appendChild(btn);
            });

            // Старт таймера
            timeLeft = stepData.timer || 20;
            updateTimerUI();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerUI() {
            timerUI.innerText = `⏱ 00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
            if (timeLeft <= 5) {
                timerUI.classList.add('critical');
            } else {
                timerUI.classList.remove('critical');
            }
        }

        function handleTimeout() {
            loyalty = 0;
            updateLoyaltyUI();

            const timeoutReply = {
                isCritical: false,
                loyaltyDelta: -50,
                nextStep: 'fail',
                feedback: "<strong>Время вышло!</strong> Вы слишком долго думали, и контрагент повесил трубку."
            };
            showFeedback(timeoutReply);
        }

        function selectReply(reply) {
            clearInterval(timerInterval);

            // Отрисовка нашего ответа
            const bubble = document.createElement('div');
            bubble.className = 'sim-bubble sim-bubble-user';
            bubble.innerHTML = reply.text;
            chatHistory.appendChild(bubble);
            scrollToBottom();

            // Обновление лояльности
            if (reply.isCritical) {
                loyalty -= 50;
            } else {
                loyalty += reply.loyaltyDelta;
            }

            if (loyalty > 100) loyalty = 100;
            if (loyalty <= 0) loyalty = 0;
            updateLoyaltyUI();

            showFeedback(reply);
        }

        function updateLoyaltyUI() {
            loyaltyFill.style.width = loyalty + '%';
            loyaltyFill.className = 'loyalty-fill';
            loyaltyScoreText.innerText = loyalty;

            if (loyalty <= 30) {
                loyaltyFill.classList.add('danger');
                avatarEmoji.innerText = '😡';
            } else if (loyalty >= 75) {
                loyaltyFill.classList.add('success');
                avatarEmoji.innerText = '🤝';
            } else {
                avatarEmoji.innerText = '😐';
            }
        }

        function showFeedback(reply) {
            controls.style.display = 'none';
            feedbackBox.style.display = 'block';

            let calloutClass = 'callout-box';
            let btnAction = '';
            let btnText = '';

            // Логика визуализации исхода шага
            if (reply.isCritical || loyalty <= 0) {
                calloutClass = 'callout-box warning-type sim-critical-error'; // Красная зона
                btnText = 'Завершить звонок (Срыв)';
                btnAction = `finalizeCall(false)`;
            } else if (reply.nextStep === 'fail') {
                calloutClass = 'callout-box warning-type'; // Обычная ошибка
                btnText = 'Сделка сорвана ➔';
                btnAction = `finalizeCall(false)`;
            } else if (reply.nextStep === 'success') {
                calloutClass = 'callout-box success-type';
                btnText = 'Сделка заключена ➔';
                btnAction = `finalizeCall(true)`;
            } else {
                calloutClass = 'callout-box info-type';
                btnText = 'Продолжить диалог ➔';
                btnAction = `loadStep('${reply.nextStep}')`;
            }

            feedbackBox.innerHTML = `
                <div class="${calloutClass}" style="animation: contentFadeIn 0.3s ease-out;">
                    <p style="margin-top: 0;">${reply.feedback}</p>
                    <button class="open-btn" style="margin-top: 15px; width: auto; padding: 10px 24px;" onclick="${btnAction}">${btnText}</button>
                </div>
            `;
            scrollToBottom();
        }

        function finalizeCall(isSuccess) {
            currentScenarioIndex++;
            initStartScreen(); // Возврат на чистый стол для следующего звонка
        }

        function showFinalResult() {
            startScreen.style.display = 'none';
            simWrapper.style.display = 'none';

            document.querySelector('.kb-container').innerHTML += `
                <div class="callout-box success-type" style="text-align: center; max-width: 600px; margin: 50px auto;">
                    <h3 style="margin-top: 0;">Все сценарии пройдены</h3>
                    <p>Вы завершили тренировку в симуляторе. Практика помогает увереннее вести переговоры.</p>
                    <a href="extra_training.html" class="fc-btn" style="margin-top: 20px; text-decoration: none; display: inline-block;">Выйти в каталог</a>
                </div>
            `;
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Запуск при загрузке: перемешиваем базу сценариев и инициируем стартовый экран
        window.onload = function () {
            shuffle(simulatorScenariosV2); // Рандомизируем порядок звонков при каждом обновлении страницы
            initStartScreen();
        };
    </script>
