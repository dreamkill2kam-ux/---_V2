<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочие процедуры</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="knowledge_base-page">
    <header>
        <a href="index.html">
            <img src="img/knowledge_banner.png" alt="Баннер" class="header-banner">
        </a>
    </header>
    <!-- 🖥️ ЦЕНТРАЛЬНЫЙ БЛОК -->
    <div class="kb-container">

        <!-- Кнопка возврата в Базу знаний -->
        <a href="knowledge_base.html" class="header-back-btn">← Вернуться в Базу знаний</a>

        <!-- 🎛️ ПАНЕЛЬ ФИЛЬТРОВ -->
        <div class="faq-controls" style="justify-content: center; margin-bottom: 40px;">
            <button class="faq-filter-chip active" data-aud="Все">Все отделы</button>
            <button class="faq-filter-chip" data-aud="ЛСТ">Логист СТ</button>
            <button class="faq-filter-chip" data-aud="ЛПТ">Логист ПТ</button>
            <button class="faq-filter-chip" data-aud="КО">Клиентский отдел</button>
            <button class="faq-filter-chip" data-aud="Б">Бухгалтерия</button>
            <button class="faq-filter-chip" data-aud="Р">Руководители</button>
        </div>

        <!-- Заголовок раздела -->
        <h1 style="text-align: center; margin-bottom: 40px; color: var(--text-main); clear: both;">Рабочие процедуры</h1>

        <!-- 📚 СЕТКА КАРТОЧЕК ПРОЦЕДУР -->
        <div class="grid-kb">

            <!-- Карточка 1: Пособие по грузоперевозкам -->
            <div class="kb-card test-card" data-audience="Все">
                <div class="card-top">
                    <span class="card-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"></path>
                            <path d="M14 9h4l4 4v5c0 .6-.4 1-1 1h-2"></path>
                            <circle cx="7" cy="18" r="2"></circle>
                            <circle cx="17" cy="18" r="2"></circle>
                            <path d="M14 13h7"></path>
                        </svg>
                    </span>
                    <h3>ОЭБ: Проверка перевозчика</h3>
                    <p>Правила, требования и процедура проверки перевозчика в ОЭБ</p>
                </div>
                <!-- Ссылка на файл пособия с сайдбаром -->
                <a href="oeb_check.html" class="open-btn">Открыть</a>
            </div>

        </div>
    </div>

    <!-- Базовые скрипты портала -->
    <script src="base.js"></script>
    <script src="theme.js"></script>

</body>

</html>
